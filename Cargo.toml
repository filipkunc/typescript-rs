[package]
name = "typescript-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "An experimental TypeScript type checker written in Rust"
license = "MIT OR Apache-2.0"

[dependencies]
oxc_allocator = { version = "0.147.0", path = "vendor/oxc/crates/oxc_allocator" }
oxc_ast = { version = "0.147.0", path = "vendor/oxc/crates/oxc_ast" }
oxc_ast_visit = { version = "0.147.0", path = "vendor/oxc/crates/oxc_ast_visit" }
oxc_diagnostics = { version = "0.147.0", path = "vendor/oxc/crates/oxc_diagnostics" }
oxc_parser = { version = "0.147.0", path = "vendor/oxc/crates/oxc_parser" }
oxc_semantic = { version = "0.147.0", path = "vendor/oxc/crates/oxc_semantic" }
oxc_span = { version = "0.147.0", path = "vendor/oxc/crates/oxc_span" }
tokio = { version = "1", features = ["io-std", "rt-multi-thread"] }
tower-lsp-server = "0.23.0"

[[bin]]
name = "tsrs"
path = "src/main.rs"

[[bin]]
name = "compare-tsgo"
path = "src/bin/compare_tsgo.rs"

[dev-dependencies]
criterion = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bench]]
name = "check_file"
harness = false

[profile.release]
lto = "thin"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
